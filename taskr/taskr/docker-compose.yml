services:

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    container_name: taskr-api
    restart: unless-stopped
    environment:
      - PORT=4000
      - DB_PATH=/data/taskr.db
      - JWT_SECRET=change-this-to-something-long-and-random-in-production
    volumes:
      - taskr-data:/data
    networks:
      - taskr-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: taskr-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskr-net

volumes:
  taskr-data:
    driver: local

networks:
  taskr-net:
    driver: bridge
